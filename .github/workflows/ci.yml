name: WorkLink Production CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: worklink
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Linting (oxlint)
        run: npm run lint

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/worklink
        run: npm run db:migrate

      - name: Execute Automated Test Suite (Security, Concurrency, RBAC, API)
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/worklink
          JWT_SECRET: ci-test-secret-key-32-characters-long!
          PORT: 5001
        run: npm test

      - name: Build Frontend Client (Vite Production Bundle)
        run: npm run build

      - name: Verify Submission Package Integrity
        run: |
          npm run pack
          npm run pack:check
